<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonara Control</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --quiet: #6b6a64; --rule: #e4e2da;
    --accent: #2f6f5e; --warn: #b5651d; --bad: #a33a3a; --track: #ecebe5;
    --ne: #3a6ea5; --ht: #b5651d; --ach: #7a4fa0; --da: #2f6f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1e1f1c; --ink: #ecebe5; --quiet: #9a998f; --rule: #2e2f2b;
      --accent: #5fb39a; --warn: #e0954f; --bad: #e07070; --track: #2a2b27;
      --ne: #79a8dc; --ht: #e0954f; --ach: #b48ad6; --da: #5fb39a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 24px;
           border-bottom: 1px solid var(--rule); }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule);
          text-transform: uppercase; letter-spacing: 0.06em; color: var(--quiet); }
  .pill.awake { color: var(--accent); border-color: var(--accent); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .meta { color: var(--quiet); font-size: 12px; margin-left: auto; }
  #power { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--rule);
           background: var(--panel); color: var(--quiet); font-size: 13px; font-weight: 600;
           cursor: pointer; transition: all .15s; }
  #power.on { border-color: var(--accent); color: var(--accent);
              box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px 24px;
         max-width: 1200px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
            padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--quiet);
       margin: 0 0 12px; font-weight: 600; }
  .bar { margin-bottom: 12px; }
  .bar .row { display: flex; justify-content: space-between; font-size: 13px; }
  .bar .row span:last-child { color: var(--quiet); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--track); border-radius: 4px; position: relative;
           margin-top: 4px; overflow: hidden; }
  .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; transition: all .3s; }
  .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink);
          opacity: .55; z-index: 1; }
  .small { font-size: 13px; color: var(--quiet); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--rule); display: flex;
       gap: 8px; }
  li:first-child { border-top: 0; }
  .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px;
          background: var(--track); white-space: nowrap; align-self: flex-start; }
  .chip.ANSWER { color: var(--accent); } .chip.HEDGE { color: var(--warn); }
  .chip.CLARIFY { color: var(--ne); }
  #chat { display: flex; flex-direction: column; height: calc(100vh - 140px); min-height: 480px;
          padding: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 0 0 14px; max-width: 85%; }
  .msg.user { margin-left: auto; background: var(--track); padding: 10px 14px;
              border-radius: 12px 12px 2px 12px; }
  .msg.bot { padding: 2px 0; }
  .msg.err { color: var(--bad); font-size: 13px; }
  .msg .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  details { margin-top: 6px; }
  summary { font-size: 12px; color: var(--quiet); cursor: pointer; }
  pre { font-size: 12px; background: var(--track); padding: 10px; border-radius: 6px;
        white-space: pre-wrap; margin: 6px 0 0; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--rule); }
  textarea { flex: 1; resize: none; height: 46px; padding: 12px; border-radius: 8px;
             border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
             font: inherit; }
  button.send { padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent);
                color: #fff; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <button id="power" title="Turn Sonara on or off">…</button>
  <h1>Sonara</h1>
  <span id="state" class="pill">…</span>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div>
    <section>
      <h2>Modulator bus</h2>
      <div id="mods"></div>
      <div class="small">Marks show baseline. DA is the last prediction error (−1 to +1).</div>
    </section>
    <section>
      <h2>Affect vs their usual</h2>
      <div id="affect" class="small">No turns yet.</div>
    </section>
    <section>
      <h2>Temporal window</h2>
      <ul id="hot"><li class="small">Empty.</li></ul>
    </section>
    <section>
      <h2>Recent actions</h2>
      <ul id="recent"><li class="small">None yet.</li></ul>
    </section>
  </div>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="text" placeholder="Talk to Sonara…"></textarea>
      <button class="send" id="send">Send</button>
    </form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const BASE = { ne: 0.3, ht: 0.3, ach: 0.2 };
const LABELS = { ne: "NE · curiosity", ht: "5-HT · caution", ach: "ACh · new-input trust" };

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function bar(name, label, v, base) {
  return `<div class="bar"><div class="row"><span>${label}</span><span>${v.toFixed(2)}</span></div>
    <div class="track"><div class="fill" style="left:0;width:${v * 100}%;background:var(--${name})"></div>
    <div class="mark" style="left:${base * 100}%"></div></div></div>`;
}
function daBar(v) {
  const left = v < 0 ? 50 + v * 50 : 50, width = Math.abs(v) * 50;
  return `<div class="bar"><div class="row"><span>DA · prediction error</span><span>${v >= 0 ? "+" : ""}${v.toFixed(2)}</span></div>
    <div class="track"><div class="fill" style="left:${left}%;width:${width}%;background:var(--${v < 0 ? "bad" : "da"})"></div>
    <div class="mark" style="left:50%"></div></div></div>`;
}

async function refresh() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("power").textContent = s.on ? "ON" : "OFF";
    $("power").className = s.on ? "on" : "";
    $("state").textContent = s.state;
    $("state").className = "pill " + s.state;
    $("meta").textContent = `sensor: ${s.providers.sensor} · generator: ${s.providers.generator} · ` +
      `embedder: ${s.embedder} · ${s.counts.turns} turns · ${s.counts.cues} cues · ` +
      `${s.counts.corrections} corrections · ${s.counts.evidence} evidence records`;
    const m = s.modulators;
    $("mods").innerHTML = ["ne", "ht", "ach"].map(k => bar(k, LABELS[k], m[k], BASE[k])).join("") + daBar(m.da || 0);
    if (s.affect) {
      const dv = s.affect.valence - s.affect.valence_base, da = s.affect.arousal - s.affect.arousal_base;
      $("affect").innerHTML = `Valence ${dv >= 0 ? "+" : ""}${dv.toFixed(2)} vs usual (${s.affect.valence_base.toFixed(2)})<br>` +
        `Arousal ${da >= 0 ? "+" : ""}${da.toFixed(2)} vs usual (${s.affect.arousal_base.toFixed(2)})`;
    }
    $("hot").innerHTML = s.hot.length ? s.hot.map(h =>
      `<li><span style="flex:1">${esc(h.text)}</span><span class="small">heat ${h.heat.toFixed(2)}</span></li>`).join("")
      : `<li class="small">Empty.</li>`;
    $("recent").innerHTML = s.recent.length ? s.recent.map(r =>
      `<li><span class="chip ${r.action}">${r.action}</span><span style="flex:1">${esc(r.text)}</span>` +
      `<span class="small">${r.outcome === null ? "…" : (r.outcome > 0 ? "+1" : r.outcome < 0 ? "−1" : "0")}</span></li>`).join("")
      : `<li class="small">None yet.</li>`;
    $("send").disabled = !s.on;
  } catch (e) { $("state").textContent = "not running"; }
}

function add(html, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
}

$("power").onclick = async () => { await fetch("/api/toggle", { method: "POST" }); refresh(); };

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = ""; add(esc(text), "user");
  const pending = add(`<span class="small">thinking…</span>`, "bot");
  $("send").disabled = true;
  try {
    const r = await (await fetch("/api/chat", { method: "POST",
      headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) })).json();
    if (r.error) { pending.className = "msg err"; pending.textContent = r.error; }
    else {
      pending.innerHTML = `<div class="head"><span class="chip ${r.action}">${r.action}</span>` +
        `<span class="small">confidence ${r.confidence.toFixed(2)} · novelty ${r.novelty.toFixed(2)}</span></div>` +
        `<div>${esc(r.response).replace(/\n/g, "<br>")}</div>` +
        `<details><summary>state brief</summary><pre>${esc(r.brief)}</pre></details>`;
    }
  } catch (err) { pending.className = "msg err"; pending.textContent = "Could not reach Sonara."; }
  refresh();
};
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
