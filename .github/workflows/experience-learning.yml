name: Sonara experience-learning benchmark

on:
  push:
    paths:
      - experiment_experience_learning.py
      - LLM_Training.py
      - sonara_memory.py
      - .github/workflows/experience-learning.yml
  workflow_dispatch:

jobs:
  synthetic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile
        run: python -m py_compile LLM_Training.py sonara_memory.py experiment_experience_learning.py
      - name: Existing mechanism regression
        run: |
          python LLM_Training.py --mode self-test
          python test_sonara_memory.py
      - name: Controlled experience benchmark
        run: |
          python experiment_experience_learning.py --seeds 1 --steps 60 --output artifacts/experience_learning_report.json
      - name: Publish experiment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-learning-results
          path: artifacts/experience_learning_report.json
          if-no-files-found: warn
