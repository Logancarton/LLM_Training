name: Sonara experience-learning benchmark

on:
  push:
    paths:
      - experiment_experience_learning.py
      - LLM_Training.py
      - sonara_memory.py
      - sonara_world.py
      - sonara_research.py
      - test_two_models.py
      - .github/workflows/experience-learning.yml
  pull_request:
    paths:
      - experiment_experience_learning.py
      - EXPERIMENT_EXPERIENCE_REPORT.md
      - README.md
      - LLM_Training.py
      - sonara_memory.py
      - sonara_world.py
      - sonara_research.py
      - test_two_models.py
      - .github/workflows/experience-learning.yml
  workflow_dispatch:

jobs:
  synthetic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile
        run: python -m py_compile LLM_Training.py sonara_memory.py sonara_world.py sonara_research.py test_two_models.py experiment_experience_learning.py
      - name: Existing mechanism regression
        run: |
          python LLM_Training.py --mode self-test
          python test_sonara_memory.py
          python -m unittest -q test_two_models
      - name: Live synthetic CLI session
        run: |
          printf 'Jake moved a ball into the pond.\nJake moved a ball into the shed.\n/ask Where was the ball before it was at the shed?\n/ask Where is the ball?\n/ask Who is Jake?\n/research Why?\n/quit\n' | python LLM_Training.py --mode session --device cpu --data-dir "$RUNNER_TEMP/sonara_synthetic_session" > "$RUNNER_TEMP/session_output.txt"
          grep -q 'Previously reported location: ball was at pond' "$RUNNER_TEMP/session_output.txt"
          grep -q 'Observed report: ball was at shed' "$RUNNER_TEMP/session_output.txt"
          grep -q 'UNVERIFIED NEURAL PREDICTION' "$RUNNER_TEMP/session_output.txt"
          grep -q 'Local research is disabled' "$RUNNER_TEMP/session_output.txt"
      - name: Scoped diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Controlled experience benchmark (3 seeds)
        run: |
          python experiment_experience_learning.py --seeds 3 --steps 60 --output artifacts/experience_learning_report.json
      - name: Publish experiment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-learning-results
          path: artifacts/experience_learning_report.json
          if-no-files-found: warn
