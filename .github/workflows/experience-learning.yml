name: Sonara experience-learning benchmark

on:
  push:
    paths:
      - experiment_experience_learning.py
      - experiment_world_learning.py
      - LLM_Training.py
      - sonara_memory.py
      - sonara_research.py
      - sonara_world_model.py
      - test_sonara_world_model.py
      - test_live_boundaries.py
      - sonara_adaptive.py
      - test_sonara_adaptive.py
      - experiment_causal_loop.py
      - experiment_processing_efficiency.py
      - test_world_efficiency.py
      - test_causal_loop.py
      - .github/workflows/experience-learning.yml
  pull_request:
    paths:
      - experiment_experience_learning.py
      - experiment_world_learning.py
      - EXPERIMENT_EXPERIENCE_REPORT.md
      - EXPERIMENT_WORLD_REPORT.md
      - EXPERIMENT_CAUSAL_LOOP_REPORT.md
      - README.md
      - LLM_Training.py
      - sonara_memory.py
      - sonara_research.py
      - sonara_world_model.py
      - test_sonara_world_model.py
      - test_live_boundaries.py
      - sonara_adaptive.py
      - test_sonara_adaptive.py
      - experiment_causal_loop.py
      - experiment_processing_efficiency.py
      - test_world_efficiency.py
      - test_causal_loop.py
      - .github/workflows/experience-learning.yml
  workflow_dispatch:

jobs:
  synthetic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile
        run: python -m py_compile LLM_Training.py sonara_memory.py sonara_research.py sonara_world_model.py test_sonara_world_model.py test_live_boundaries.py sonara_adaptive.py test_sonara_adaptive.py experiment_causal_loop.py test_causal_loop.py experiment_experience_learning.py experiment_world_learning.py experiment_processing_efficiency.py test_world_efficiency.py
      - name: Existing mechanism regression
        run: |
          python LLM_Training.py --mode self-test
          python test_sonara_memory.py
          python -m unittest -q test_live_boundaries test_sonara_adaptive test_causal_loop
          python -m unittest -v test_sonara_world_model test_world_efficiency
      - name: Live synthetic CLI session
        run: |
          printf 'Jake moved a ball into the pond.\nJake moved a ball into the shed.\n/ask Where was the ball before it was at the shed?\n/ask Where is the ball?\n/recall ball\n/train-world\n/research Why?\n/quit\n' | python LLM_Training.py --mode session --device cpu --data-dir "$RUNNER_TEMP/sonara_synthetic_session" > "$RUNNER_TEMP/session_output.txt"
          grep -q 'UNKNOWN: No trained world-question answering mechanism' "$RUNNER_TEMP/session_output.txt"
          grep -q 'Retired: rule-labeled classifier' "$RUNNER_TEMP/session_output.txt"
          grep -q 'Local research is disabled' "$RUNNER_TEMP/session_output.txt"
          grep -q 'Found .* relevant memory' "$RUNNER_TEMP/session_output.txt"
          ! grep -q 'Observed report: ball was' "$RUNNER_TEMP/session_output.txt"
          ! grep -q 'Previously reported location: ball' "$RUNNER_TEMP/session_output.txt"
      - name: Scoped diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Controlled experience benchmark (3 seeds)
        run: |
          python experiment_experience_learning.py --seeds 3 --steps 60 --output artifacts/experience_learning_report.json
      - name: Neural world model benchmark (3 seeds)
        run: |
          python experiment_world_learning.py --seeds 3 --steps 40 --output artifacts/world_learning_report.json
      - name: One- and two-experience causal transfer gate
        run: |
          python LLM_Training.py --mode experience --experience-seeds 3 --experience-dim 24 --experience-heldout 3 --device cpu --data-dir "$RUNNER_TEMP/causal_learning" --experience-output artifacts/causal_learning_report.json
          python - <<'PY'
          import json
          r = json.load(open('artifacts/causal_learning_report.json'))
          assert r['summary']['one_verified_experience_per_seed']
          assert r['summary']['all_verifications_passed']
          assert r['summary']['two_verified_experiences_per_pair_run']
          assert r['summary']['pair_verifications_passed']
          assert all(len(run['one_experience']['trial']['action_scores']) == 2 for run in r['action_pair_runs'])
          PY
      - name: Processing efficiency ablations (3 seeds)
        run: python experiment_processing_efficiency.py --seeds 3 --repetitions 8 --output artifacts/processing_efficiency_report.json
      - name: Publish experiment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-learning-results
          path: |
            artifacts/experience_learning_report.json
            artifacts/world_learning_report.json
            artifacts/causal_learning_report.json
            artifacts/processing_efficiency_report.json
          if-no-files-found: warn
